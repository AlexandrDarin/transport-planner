{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title|default:"Сервис планирования поездок" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm"><div class="container">
  <a class="navbar-brand" href="{% url 'homepage:index' %}">🚌 Сервис поездок</a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto">
    <a class="nav-link {% if active == 'home' %}active{% endif %}" href="{% url 'homepage:index' %}">Главная</a>
    <a class="nav-link {% if active == 'routes' %}active{% endif %}" href="{% url 'routes:list' %}">Маршруты</a>
    <a class="nav-link {% if active == 'stops' %}active{% endif %}" href="{% url 'stops:list' %}">Остановки</a>
    <a class="nav-link {% if active == 'trips' %}active{% endif %}" href="{% url 'trips:list' %}">Поездки</a>
    <a class="nav-link {% if active == 'users' %}active{% endif %}" href="{% url 'users:list' %}">Пользователи</a>
    <a class="nav-link {% if active == 'statistics' %}active{% endif %}" href="{% url 'homepage:statistics' %}">Статистика</a>
    <a class="nav-link {% if active == 'about' %}active{% endif %}" href="{% url 'homepage:about' %}">О проекте</a>
  </div></div>
</div></nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<footer class="container text-center text-secondary small py-4">Сервис планирования поездок · Django + SQLite</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'homepage/js/main.js' %}"></script>
</body></html>
