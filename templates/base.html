{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис планирования поездок{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}

    <main class="container py-4">
        {% block breadcrumbs %}{% endblock %}
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container text-center text-secondary small py-4">
        <p class="mb-0">
            © <span id="current-year"></span> Сервис планирования поездок
            · Django + SQLite
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
