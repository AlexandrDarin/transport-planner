{% extends "base.html" %}{% block content %}<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"><div><h1>Остановки</h1><p class="text-secondary">Остановочные пункты по городам.</p></div><form method="get" class="d-flex gap-2"><input class="form-control" name="q" value="{{ query }}" placeholder="Название или город" data-autofocus="true"><button class="btn btn-primary">Найти</button></form></div><div class="row g-3">{% for stop in stops %}<div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h5">📍 {{ stop.name }}</h2><p class="text-secondary">{{ stop.city }}</p><a href="{% url 'stops:detail' stop.id %}" class="btn btn-sm btn-outline-primary">Подробнее</a></div></div></div>{% empty %}<div class="col-12"><div class="alert alert-info">Остановки не найдены.</div></div>{% endfor %}</div>{% endblock %}
