{% if trip.status == 'cancelled' %}
    <span class="badge text-bg-secondary trip-status trip-status-cancelled">Отменена</span>
{% elif trip.status == 'completed' %}
    <span class="badge text-bg-info trip-status trip-status-completed">Завершена</span>
{% else %}
    <span class="badge text-bg-success trip-status trip-status-active">Активна</span>
{% endif %}
