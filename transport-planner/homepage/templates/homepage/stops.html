{% extends "homepage/base.html" %}
{% block title %}Остановки{% endblock %}
{% block content %}
<h1>Остановки</h1>
<div class="table-wrap"><table><thead><tr><th>Название</th><th>Широта</th><th>Долгота</th></tr></thead><tbody>
{% for stop in stops %}<tr><td>{{ stop.name }}</td><td>{{ stop.latitude }}</td><td>{{ stop.longitude }}</td></tr>
{% empty %}<tr><td colspan="3">Остановок пока нет.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
